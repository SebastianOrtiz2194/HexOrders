# =============================================================================
# docker-compose.yml — Order Management System (OMS)
# =============================================================================
# Stack: PostgreSQL 16 · Redis 7 · Apache Kafka (with Zookeeper)
#
# Usage:
#   docker-compose up -d            -> Start all services in the background
#   docker-compose ps               -> View status and health-checks
#   docker-compose logs -f kafka    -> Follow logs of a specific service
#   docker-compose down -v          -> Destroy containers AND volumes
# =============================================================================

name: hexorders

# ---------------------------------------------------------------------------
# Networks: using a dedicated bridge network to isolate the OMS stack.
# All services communicate via service name (Docker internal DNS).
# ---------------------------------------------------------------------------
networks:
  oms-network:
    driver: bridge

# ---------------------------------------------------------------------------
# Persistent volumes: Postgres and Redis data survives restarts.
# Without this, each 'docker-compose down' would wipe the entire database.
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:


services:

  # =========================================================================
  # PostgreSQL 16 — Main relational database
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: oms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oms_db}
      POSTGRES_USER: ${POSTGRES_USER:-oms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oms_password}
      # Optimization: pre-warm Postgres cache on startup
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional initialization script (base DDL if not using Flyway)
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - oms-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oms_user} -d ${POSTGRES_DB:-oms_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================================================================
  # Redis 7 — High-speed cache and session management
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: oms-redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-oms_redis_pass} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - oms-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-oms_redis_pass}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # Zookeeper — Kafka cluster coordination
  # =========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: oms-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Reduced HeapOpts for local environments (default is 512m)
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
      # The Confluent image requires this JVM property to enable 4LW commands like 'ruok'
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,srvr"
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    networks:
      - oms-network
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # =========================================================================
  # Apache Kafka — Message broker for event-driven communication
  # =========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: oms-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168 # 7 days of message retention
      KAFKA_LOG_SEGMENT_BYTES: 1073741824 # 1GB per log segment
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_NUM_PARTITIONS: 3 # Initial parallelism for the topic
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    networks:
      - oms-network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092" ]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 45s

  # =========================================================================
  # Kafka UI — Web interface for inspecting topics/messages (optional)
  # =========================================================================
  # Allows viewing OrderCreated events in real-time
  # without using kafka-console-consumer from the terminal.
  # Access: http://localhost:8090
  # =========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: oms-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: oms-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    ports:
      - "8090:8080"
    networks:
      - oms-network

  # =========================================================================
  # Zipkin — Distributed Tracing UI
  # =========================================================================
  # Allows visually inspecting latencies and bottlenecks,
  # seeing how a request travels through the entire system.
  # Access: http://localhost:9411
  # =========================================================================
  zipkin:
    image: openzipkin/zipkin
    container_name: oms-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - oms-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9411" ]
      interval: 10s
      timeout: 5s
      retries: 5
